
{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Tienda Lula{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/estilos.css' %}">
</head>
<body>

    {% block header %}
    <header class="encabezado-principal">
        <img src="{% static 'productos/logo-tienda-lula.jpeg' %}" alt="Logo Tienda Lula">
        <h1>Tienda Lula</h1>
        <p>Ventas por mayor y menor</p>
    </header>
    {% endblock %}

    {% block navigation %}
    <nav>
        <a href="{% url 'inicio' %}">Inicio</a>
        <a href="{% url 'productos:listar_productos' %}">Productos</a>
        <a href="{% url 'categorias:listar_categorias' %}">Categorías</a>
        <a href="{% url 'clientes:listar_clientes' %}">Clientes</a>
        <a href="{% url 'ventas:listar_ventas' %}">Ventas</a>
    </nav>
    {% endblock %}

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>Tienda Lula - Sistema de gestión</p>
    </footer>

</body>
</html>
