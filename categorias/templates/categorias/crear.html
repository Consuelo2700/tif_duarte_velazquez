{% extends 'base.html' %}

{% block title %}
    Registrar categoría - Tienda Lula
{% endblock %}

{% block content %}

<section class="panel panel-formulario">

    <h1 class="titulo-pagina">
        Registrar categoría
    </h1>

    <form method="POST" class="formulario">

        {% csrf_token %}

        {{ formulario.as_p }}

        <button type="submit" class="boton">
            Guardar categoría
        </button>

    </form>

    <a class="enlace-volver"
       href="{% url 'categorias:listar_categorias' %}">
        Volver al listado
    </a>

</section>

{% endblock %}
