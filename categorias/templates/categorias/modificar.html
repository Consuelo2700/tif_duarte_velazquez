
{% extends 'base.html' %}

{% block title %}Modificar categoría - Tienda Lula{% endblock %}

{% block content %}

<div class="contenedor-formulario">

    <h1>Modificar categoría</h1>

    <form method="POST">
        {% csrf_token %}

        {{ formulario.as_p }}

        <button type="submit">Guardar cambios</button>
    </form>

    <a class="volver" href="{% url 'categorias:listar_categorias' %}">
        Volver al listado
    </a>

</div>

{% endblock %}
