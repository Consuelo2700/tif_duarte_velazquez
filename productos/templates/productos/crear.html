
{% extends 'base.html' %}

{% block title %}
    Registrar producto - Tienda Lula
{% endblock %}

{% block content %}

<section class="panel panel-formulario">

    <h1 class="titulo-pagina">
        Registrar producto
    </h1>


    <form method="POST" class="formulario">

        {% csrf_token %}

        {{ formulario.as_p }}

        <button type="submit" class="boton">
            Guardar producto
        </button>

    </form>


    <a class="enlace-volver"
       href="{% url 'productos:listar_productos' %}">

        Volver al listado

    </a>

</section>

{% endblock %}
