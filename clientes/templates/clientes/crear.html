
{% extends 'base.html' %}

{% block title %}
    Registrar cliente - Tienda Lula
{% endblock %}

{% block content %}

<section class="panel panel-formulario">

    <h1 class="titulo-pagina">
        Registrar cliente
    </h1>

    <form method="POST" class="formulario">

        {% csrf_token %}

        {{ formulario.as_p }}

        <button type="submit" class="boton">
            Guardar cliente
        </button>

    </form>

    <a class="enlace-volver"
       href="{% url 'clientes:listar_clientes' %}">
        Volver al listado
    </a>

</section>

{% endblock %}
